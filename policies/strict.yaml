# trusted-mcp strict policy
# Blocks all unrecognized tools, high sensitivity scanning
version: "1.0"
name: "strict-policy"

proxy:
  transport: stdio
  timeout_ms: 15000
  max_concurrent: 5

scanners:
  - name: description_hash
    enabled: true
    settings:
      store_path: .trusted-mcp/hashes.json
      auto_approve_new: false

  - name: allowlist
    enabled: true
    settings:
      mode: allowlist
      tools:
        allow: []
        # Add tools you trust explicitly:
        # - "github:create_pr"
        # - "github:list_repos"

  - name: regex
    enabled: true
    settings:
      sensitivity: high

  - name: argument
    enabled: true
    settings:
      max_string_length: 10000

  - name: pii
    enabled: true
    settings:
      action_on_detect: block
      scan_requests: true

audit:
  enabled: true
  storage: file
  path: .trusted-mcp/audit.jsonl
  max_size_mb: 50
