# trusted-mcp default policy
# Balanced security with minimal friction
version: "1.0"
name: "default-policy"

proxy:
  transport: stdio
  timeout_ms: 30000
  max_concurrent: 10

scanners:
  - name: description_hash
    enabled: true
    settings:
      store_path: .trusted-mcp/hashes.json

  - name: allowlist
    enabled: true
    settings:
      mode: blocklist
      tools:
        block:
          - "shell:execute_command"
          - "filesystem:delete_file"
          - "filesystem:write_file"

  - name: regex
    enabled: true
    settings:
      sensitivity: medium

audit:
  enabled: true
  storage: file
  path: .trusted-mcp/audit.jsonl
  max_size_mb: 100
